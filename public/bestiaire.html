<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bestiaire — Grimoire des Douze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/pages/monsters.js"></script>
</head>
<body data-nav="bestiaire" class="flex min-h-screen flex-col">
  <header data-layout="header" class="min-h-16 bg-wood-dark"></header>
  <main class="page flex flex-col gap-6 py-8">
    <h1 class="m-0 text-3xl text-wood sm:text-4xl">Bestiaire</h1>
    <form id="filters" role="search" class="panel grid gap-4 p-4 sm:grid-cols-[2fr_1fr_1fr_1fr] sm:items-end">
      <div class="flex flex-col gap-1.5">
        <label for="f-q" class="font-semibold">Nom</label>
        <input id="f-q" name="q" type="search" class="field" placeholder="Bouftou, Tofu…" autocomplete="off" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="f-boss" class="font-semibold">Type</label>
        <select id="f-boss" name="boss" class="field">
          <option value="">Tous</option>
          <option value="true">Boss</option>
          <option value="false">Hors boss</option>
        </select>
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="f-min" class="font-semibold">Niveau min.</label>
        <input id="f-min" name="minLevel" type="number" min="1" max="200" inputmode="numeric" class="field" placeholder="1" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="f-max" class="font-semibold">Niveau max.</label>
        <input id="f-max" name="maxLevel" type="number" min="1" max="200" inputmode="numeric" class="field" placeholder="200" />
      </div>
    </form>
    <span id="count" class="text-sm text-muted" aria-live="polite"></span>
    <div id="grid" class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4"></div>
    <div id="pager"></div>
  </main>
  <footer data-layout="footer"></footer>
</body>
</html>
